name: ci

# The desktop app. The website lives in site/ and is built and deployed by
# pages.yml — it shares no toolchain with this job, so a change to the landing
# page copy has no business installing webkit2gtk and compiling Rust. The
# exception is shared/, which both products consume: a token change must be
# checked here too.
#
# (The two path lists below are duplicated rather than shared with a YAML
# anchor because the GitHub Actions workflow parser does not support anchors.)
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux deps (for tauri rust crate to resolve)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
