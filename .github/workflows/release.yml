name: release

on:
  push:
    tags: ["v*"]

# Allow tauri-action to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  # The draft is created ONCE, here, before any platform builds.
  #
  # Left to itself, tauri-action creates-or-finds the release from inside each
  # matrix job, and four jobs starting at the same moment all look, all find
  # nothing, and more than one creates. That is not theoretical: 0.3.0 shipped
  # TWO drafts of the same tag, created in the same second, with the 17 artifacts
  # split across them — and, worse, a `latest.json` in each carrying only the
  # platforms that happened to land beside it. Publishing either one would have
  # offered no update at all to half the platforms, and `gh release view v0.3.0`
  # could not say which release it meant.
  #
  # The merge itself was never broken: two jobs sharing one draft merged their
  # platforms into a single latest.json correctly. Only the *finding* raced. So
  # this job creates the draft, every build job is handed its id, and there is
  # nothing left to race over.
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: create
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Grimoire ${tag}`,
              draft: true,
              prerelease: false,
            });
            core.info(`Created draft release ${data.id} for ${tag}`);
            return data.id;

  build:
    needs: create-release
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2

      # Installs rustup + a default toolchain. The actual build runs in
      # src-tauri/, which pins channel 1.96.0 via rust-toolchain.toml; rustup
      # auto-installs that toolchain (with the host target) on first use there.
      # No `targets:` here on purpose — this action adds targets to the toolchain
      # IT installs (stable) and does not read rust-toolchain.toml, so they'd
      # land on a toolchain the build never uses. See the macOS step below.
      - uses: dtolnay/rust-toolchain@stable

      # macOS runners are Apple Silicon, so the pinned 1.96.0 toolchain only has
      # aarch64 by default; the Intel build needs x86_64 added to *that*
      # toolchain. Run from src-tauri/ so the rust-toolchain.toml override
      # applies and the target lands on 1.96.0. `rustup target add` is idempotent
      # and takes space-separated targets.
      - name: Add macOS cross-compile targets
        if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (NOT OS code-signing). Required for self-update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the binary at compile time via option_env! (see lib.rs).
          # Add SPOTIFY_CLIENT_ID to the `release` environment in repo settings.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        with:
          # Upload into the draft create-release already made, rather than
          # creating-or-finding one per job. This is the whole race guard:
          # releaseId replaces tagName/releaseName/releaseDraft, which are the
          # inputs that made every job go looking for a release of its own.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Emit latest.json (the updater manifest) and attach it to the release.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
